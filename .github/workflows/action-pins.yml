name: Validate GitHub Action pins

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/scripts/check-action-pins.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/scripts/check-action-pins.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node .github/scripts/check-action-pins.mjs
