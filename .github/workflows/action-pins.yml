name: Validate GitHub Action pins

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/scripts/check-action-pins.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/scripts/check-action-pins.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node .github/scripts/check-action-pins.mjs
