name: Public navigation safety

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/check-navigation-safety.mjs
      - scripts/check-navigation-safety.test.mjs
      - .github/workflows/public-navigation-safety.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - scripts/check-navigation-safety.mjs
      - scripts/check-navigation-safety.test.mjs
      - .github/workflows/public-navigation-safety.yml

permissions:
  contents: read

concurrency:
  group: public-navigation-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Testar regressões do scanner
        run: node --test scripts/check-navigation-safety.test.mjs
      - name: Validar index.html
        run: node scripts/check-navigation-safety.mjs
