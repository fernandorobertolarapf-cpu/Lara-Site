name: Public navigation safety

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/check-navigation-safety.mjs
      - .github/workflows/public-navigation-safety.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - scripts/check-navigation-safety.mjs
      - .github/workflows/public-navigation-safety.yml

permissions:
  contents: read

concurrency:
  group: public-navigation-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node scripts/check-navigation-safety.mjs
