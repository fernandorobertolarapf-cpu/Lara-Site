name: Public site structure

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/check-static-site.mjs
      - .github/workflows/public-site-structure.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - scripts/check-static-site.mjs
      - .github/workflows/public-site-structure.yml

permissions:
  contents: read

concurrency:
  group: public-site-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node scripts/check-static-site.mjs
