name: Public password content guard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/check-public-password-examples.mjs
      - security/public-content-baseline.json
      - .github/workflows/public-password-content.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - scripts/check-public-password-examples.mjs
      - security/public-content-baseline.json
      - .github/workflows/public-password-content.yml

permissions:
  contents: read

concurrency:
  group: public-password-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node scripts/check-public-password-examples.mjs
